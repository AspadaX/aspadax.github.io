<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header shell">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/articles/' | relative_url }}"{% if page.layout == 'home' or page.layout == 'post' %} aria-current="{% if page.layout == 'home' %}page{% else %}true{% endif %}"{% endif %}>Articles</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </header>
    <main id="main" class="shell" tabindex="-1">
      {% if page.layout == 'default' %}
      <article class="page reading-width">
        <header class="page-header"><h1>{{ page.title | escape }}</h1></header>
        <div class="post-content">{{ content }}</div>
      </article>
      {% else %}
      {{ content }}
      {% endif %}
    </main>
    <footer class="site-footer shell">
      <span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
      <nav aria-label="Footer">
        <a href="https://github.com/{{ site.github_username | escape }}">GitHub <span aria-hidden="true">↗</span></a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a>
      </nav>
    </footer>
  </body>
</html>
